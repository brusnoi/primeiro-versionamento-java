<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul{
            height: 250px;
            list-style-type: none;
            display: flex;
            flex-direction:column;
            /* Alinha os elementos no eixo principal que foi definido no flex-direction. Por padrão ele vem como row(linha) */
            /* Flex-start - Alinha os elementos no inicio do container*/
            /*Center = Alinha os elementos no centro do container*/ 
            /*Flex-end - Alinha os elementos no final do container*/
            /* space-between - Da um espaço entre os elementos*/
            /*space-aroud - Um espaço ao redor dos elementos*/
            /*space-evenly - Um espacamentos maior ao redor*/
            justify-content:flex-end;
            border: 1px solid maroon;
            align-items:center;
            /*gap: 50px; */
        }
    </style>
</head>
<body>
   <ul>
    <li> brusno</li>
    <li>carol</li>
    <li>maria</li>
    <li>tirzah</li>
    <li>ailton</li>
    <li>carlos</li>
    <li>nega</li>
   </ul> 


<ol>
    <li>segunda-feira</li>
    <li>terça-feira</li>

    <li>quinta-feira</li>
    <li>sexta-feira</li>
    <li>sabado</li>
    <li>domingo</li>
</ol>


</body>
</html>
